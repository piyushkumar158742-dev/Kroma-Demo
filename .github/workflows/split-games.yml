name: Split games into folders

on:
  push:
    branches:
      - refactor/games-into-folders

permissions:
  contents: write

jobs:
  split:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: split games into folders') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split game files
        env:
          BRANCH_NAME: refactor/games-into-folders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          games=[('index.html','cosmic-calendar'),('game2.html','block-market'),('game3.html','stop-at-5000'),('game4.html','a-is-z-typer'),('game5.html','dvd-game')]
          filename_map={x:y for x,y in games}
          style_re=re.compile(r'<style(?:\s[^>]*)?>(.*?)</style>',re.I|re.S)
          script_re=re.compile(r'<script\b([^>]*)>(.*?)</script>',re.I|re.S)
          for source,slug in games:
              text=Path(source).read_text(encoding='utf-8'); styles=[]; scripts=[]
              text=style_re.sub(lambda m:(styles.append(m.group(1).strip()) or ''),text)
              def ps(m):
                  attrs,body=m.group(1),m.group(2)
                  sm=re.search(r'\bsrc\s*=\s*["\']([^"\']+)["\']',attrs,re.I)
                  if sm:
                      if sm.group(1) in ('shared.js','./shared.js'): return '<script src="../../assets/js/shared.js"></script>'
                      return m.group(0)
                  if body.strip(): scripts.append(body.strip())
                  return ''
              text=script_re.sub(ps,text)
              text=re.sub(r'href=["\'](?:\./)?shared\.css["\']','href="../../assets/css/shared.css"',text)
              js='\n\n'.join(scripts).strip()+'\n'; css='\n\n'.join(styles).strip()+'\n'
              for old,oldslug in filename_map.items():
                  new='../'+oldslug+'/index.html'; js=js.replace('"'+old+'"','"'+new+'"').replace("'"+old+"'","'"+new+"'")
              d=Path('games')/slug; d.mkdir(parents=True,exist_ok=True)
              text=re.sub(r'</head>','  <link rel="stylesheet" href="style.css">\n</head>',text,count=1,flags=re.I)
              text=re.sub(r'</body>','  <script src="script.js"></script>\n</body>',text,count=1,flags=re.I)
              (d/'index.html').write_text(text.strip()+'\n',encoding='utf-8'); (d/'style.css').write_text(css,encoding='utf-8'); (d/'script.js').write_text(js,encoding='utf-8')
          Path('index.html').write_text('''<!DOCTYPE html>\n<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kroma</title></head><body><p style="font-family:system-ui,sans-serif;text-align:center;margin-top:20vh">Loading a random game…</p><script src="assets/js/shared.js"></script><noscript><p style="text-align:center">JavaScript is required to enter Kroma.</p></noscript></body></html>\n''',encoding='utf-8')
          p=Path('games.json'); data=json.loads(p.read_text(encoding='utf-8')); [g.update(url='games/'+g['id']+'/index.html') for g in data]; p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          for old in ['game2.html','game3.html','game4.html','game5.html','shared.css','shared.js','.github/split-trigger.txt']:
              q=Path(old)
              if q.exists(): q.unlink()
          sharedp=Path('assets/js/shared.js'); s=sharedp.read_text(encoding='utf-8')
          if 'SITE_ROOT_URL' not in s:
              s=s.replace('(function(){','''(function(){\n  var SITE_ROOT_URL=(function(){var currentScript=document.currentScript;return currentScript?new URL('../../',currentScript.src):new URL('./',window.location.href);})();\n  var GAMES_JSON_URL=new URL('games.json',SITE_ROOT_URL).href;''',1)
          s=s.replace("fetch('games.json', {cache:'no-store'})","fetch(GAMES_JSON_URL, {cache:'no-store'})")
          s=s.replace('window.location.href = GAMES[idx].url','window.location.href = new URL(GAMES[idx].url, SITE_ROOT_URL).href')
          s=s.replace('window.location.replace(selectedEntry.url)','window.location.replace(new URL(selectedEntry.url, SITE_ROOT_URL).href)')
          s=s.replace('var siteRootPath = new URL(\'.\', window.location.href).pathname.replace(/\\/+$/, \'\');','var siteRootPath = new URL(\'.\', SITE_ROOT_URL).pathname.replace(/\\/+$/, \'\');')
          s=s.replace('var currentPath = window.location.pathname.replace(/\\/+$/, \'\');','var currentPath = window.location.pathname.replace(/\\/+$/, \'\');')
          sharedp.write_text(s,encoding='utf-8')
          readme='''# Kroma-Demo\n\nA small collection of browser games and interactive experiments.\n\n## Structure\n\n```text\nKroma-Demo/\n├── assets/\n│   ├── css/shared.css\n│   └── js/shared.js\n├── games.json\n├── games/\n│   ├── cosmic-calendar/{index.html,style.css,script.js}\n│   ├── block-market/{index.html,style.css,script.js}\n│   ├── stop-at-5000/{index.html,style.css,script.js}\n│   ├── a-is-z-typer/{index.html,style.css,script.js}\n│   └── dvd-game/{index.html,style.css,script.js}\n├── index.html\n└── README.md\n```\n\nEvery game is isolated in its own folder and split into HTML, CSS, and JavaScript. Shared platform assets stay under `assets/`, and `games.json` is the registry. The root `index.html` is the random-game entry point.\n'''
          Path('README.md').write_text(readme,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: split games into folders"
          git push origin "$BRANCH_NAME"

name: Normalize game names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Normalize stale navigation labels
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              'Reverse Typer': 'A is Z Typer',
              'Unnamed DVD Game': 'DVD Game',
          }
          for name in ('game4.html', 'game5.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          Path('.github/workflows/normalize-game-names.yml').unlink()
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game4.html game5.html
          git add -u .github/workflows/normalize-game-names.yml
          git diff --cached --quiet || git commit -m "Normalize game names across navigation"
          git push

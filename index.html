<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060f">
<title>OddPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(124,108,240,.12),transparent 30%),
    #05060f;
  color:#f5f3ff;
  font-family:Inter,system-ui,sans-serif;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.34) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.2) 1px,transparent 1px);
  background-size:120px 120px,210px 210px;
  background-position:12px 30px,70px 90px;
  opacity:.16;
}
.loader{
  position:relative;
  width:min(88vw,390px);
  padding:34px 30px 30px;
  text-align:center;
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;
  background:rgba(12,13,28,.72);
  box-shadow:0 24px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.logo-wrap{display:inline-flex;align-items:center;gap:12px;margin-bottom:12px}
.mark{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#7c6cf0;
  box-shadow:0 0 24px rgba(124,108,240,.75);
  animation:pulse 1.6s ease-in-out infinite;
}
.logo{
  margin:0;
  font:700 clamp(2.2rem,8vw,3.2rem)/1 "Space Mono",monospace;
  letter-spacing:.11em;
  text-indent:.11em;
}
.kicker{
  margin:0 0 22px;
  color:#868395;
  font-size:.7rem;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.status-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.text{margin:0;color:#bbb7c9;font-size:.78rem}
.dots{display:flex;gap:4px}
.dots span{width:4px;height:4px;border-radius:50%;background:#7c6cf0;opacity:.25;animation:dot 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.16s}.dots span:nth-child(3){animation-delay:.32s}
.line{height:5px;width:100%;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.line span{display:block;width:34%;height:100%;border-radius:inherit;background:linear-gradient(90deg,rgba(124,108,240,.25),#9a8cff,rgba(124,108,240,.25));box-shadow:0 0 18px rgba(124,108,240,.45);animation:load 1.35s cubic-bezier(.45,0,.25,1) infinite}
.footer{margin-top:18px;color:#5f5d6c;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}
@keyframes load{0%{transform:translateX(-135%)}100%{transform:translateX(410%)}}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1);opacity:1}}
@keyframes dot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@media(max-width:420px){.loader{padding:30px 22px 26px;border-radius:18px}.logo{font-size:2.25rem}}
@media(prefers-reduced-motion:reduce){.mark,.dots span,.line span{animation:none}.mark{opacity:1}.line span{transform:translateX(190%)}}
</style>
</head>
<body>
<main class="loader" aria-live="polite" aria-busy="true">
  <div class="logo-wrap"><span class="mark" aria-hidden="true"></span><h1 class="logo">OddPlay</h1></div>
  <p class="kicker">Tiny games. Big distractions.</p>
  <div class="status-row">
    <p class="text" id="status">Loading arcade</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
  <div class="line" aria-hidden="true"><span></span></div>
  <div class="footer">Finding something fun…</div>
</main>
<script>
(function(){
  var status=document.getElementById('status');
  var games=[
    {name:'Cosmic Calendar',url:'game1.html'},
    {name:'Block Market',url:'game2.html'},
    {name:'Stop at 5.000',url:'game3.html'},
    {name:'A is Z Typer',url:'game4.html'},
    {name:'DVD Game',url:'game5.html'}
  ];
  var started=Date.now();
  var minimum=1250;
  function launch(list){
    var game=list[Math.floor(Math.random()*list.length)]||games[0];
    status.textContent='Opening '+game.name;
    var delay=Math.max(0,minimum-(Date.now()-started));
    setTimeout(function(){window.location.replace(game.url);},delay);
  }
  fetch('games.json',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('registry');return r.json();})
    .then(function(data){
      var live=Array.isArray(data)?data.filter(function(g){return g&&typeof g.url==='string'&&g.url.trim();}):[];
      launch(live.length?live:games);
    })
    .catch(function(){launch(games);});
})();
</script>
</body>
</html>

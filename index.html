<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060f">
<title>OddPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:#05060f;color:#f5f3ff;font-family:Inter,system-ui,sans-serif}
.loader{text-align:center;width:min(86vw,360px)}
.logo{font:700 clamp(2.4rem,9vw,3.4rem)/1 "Space Mono",monospace;letter-spacing:.16em;text-indent:.16em;margin:0 0 10px}
.text{margin:0 0 28px;color:#9693a5;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.line{height:3px;width:100%;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.line span{display:block;width:35%;height:100%;border-radius:inherit;background:#7c6cf0;animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(410%)}}
@media(prefers-reduced-motion:reduce){.line span{animation:none;transform:translateX(180%)}}
</style>
</head>
<body>
<main class="loader" aria-live="polite" aria-busy="true">
  <h1 class="logo">OddPlay</h1>
  <p class="text" id="status">Loading arcade</p>
  <div class="line" aria-hidden="true"><span></span></div>
</main>
<script>
(function(){
  var status=document.getElementById('status');
  var games=[
    {name:'Cosmic Calendar',url:'game1.html'},
    {name:'Block Market',url:'game2.html'},
    {name:'Stop at 5.000',url:'game3.html'},
    {name:'A is Z Typer',url:'game4.html'},
    {name:'DVD Game',url:'game5.html'}
  ];
  var started=Date.now();
  var minimum=1200;
  function launch(list){
    var game=list[Math.floor(Math.random()*list.length)]||games[0];
    status.textContent='Opening '+game.name;
    var delay=Math.max(0,minimum-(Date.now()-started));
    setTimeout(function(){window.location.replace(game.url);},delay);
  }
  fetch('games.json',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('registry');return r.json();})
    .then(function(data){
      var live=Array.isArray(data)?data.filter(function(g){return g&&typeof g.url==='string'&&g.url.trim();}):[];
      launch(live.length?live:games);
    })
    .catch(function(){launch(games);});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060d">
<title>OddPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#05060d;--panel:rgba(14,15,28,.82);--text:#f7f7fb;--muted:#9091a0;--accent:#8979ff;--accent2:#aaa0ff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--text);font-family:"DM Sans",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 50% 43%,rgba(137,121,255,.14),transparent 28%),radial-gradient(circle at 20% 20%,rgba(255,255,255,.02),transparent 22%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.02),transparent 22%);filter:blur(8px)}
.loader{position:relative;width:min(88vw,400px);padding:34px;border:1px solid rgba(255,255,255,.075);border-radius:22px;background:var(--panel);box-shadow:0 28px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:32px}
.mark{position:relative;width:17px;height:17px;border-radius:5px;background:linear-gradient(135deg,var(--accent2),var(--accent));transform:rotate(12deg);box-shadow:0 0 28px rgba(137,121,255,.3)}
.mark::after{content:"";position:absolute;width:5px;height:5px;left:6px;top:6px;border-radius:1.5px;background:#fff;opacity:.85}
.logo{margin:0;font:700 clamp(2.35rem,9vw,3.25rem)/1 "Space Mono",monospace;letter-spacing:-.055em}
.status{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.label{margin:0;color:#bdbdc8;font-size:.76rem;font-weight:500}
.percent{margin:0;color:#666777;font:400 .65rem/1 "Space Mono",monospace}
.track{height:5px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.065);box-shadow:inset 0 1px 1px rgba(0,0,0,.22)}
.bar{display:block;width:34%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 18px rgba(137,121,255,.32);animation:load 1.35s cubic-bezier(.65,0,.2,1) infinite}
@keyframes load{0%{transform:translateX(-135%)}100%{transform:translateX(405%)}}
@media(max-width:480px){.loader{width:min(90vw,400px);padding:28px 24px;border-radius:19px}.brand{margin-bottom:28px}.logo{font-size:2.3rem}}
@media(prefers-reduced-motion:reduce){.bar{animation:none;transform:translateX(195%)}}
</style>
</head>
<body>
<main class="loader" aria-live="polite" aria-busy="true">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1 class="logo">OddPlay</h1></div>
  <div class="status">
    <p class="label" id="status">Preparing your game</p>
    <p class="percent" id="percent">00%</p>
  </div>
  <div class="track" aria-hidden="true"><span class="bar"></span></div>
</main>
<script>
(function(){
  var status=document.getElementById('status');
  var percent=document.getElementById('percent');
  var games=[
    {name:'Cosmic Calendar',url:'game1.html'},
    {name:'Block Market',url:'game2.html'},
    {name:'Stop at 5.000',url:'game3.html'},
    {name:'A is Z Typer',url:'game4.html'},
    {name:'DVD Game',url:'game5.html'}
  ];
  var started=Date.now();
  var minimum=1350;
  var timer=setInterval(function(){
    var elapsed=Date.now()-started;
    var value=Math.min(92,Math.floor((elapsed/minimum)*86));
    percent.textContent=(value<10?'0':'')+value+'%';
  },50);
  function launch(list){
    var game=list[Math.floor(Math.random()*list.length)]||games[0];
    status.textContent='Opening '+game.name;
    percent.textContent='100%';
    clearInterval(timer);
    var delay=Math.max(0,minimum-(Date.now()-started));
    setTimeout(function(){window.location.replace(game.url);},delay);
  }
  fetch('games.json',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('registry');return r.json();})
    .then(function(data){
      var live=Array.isArray(data)?data.filter(function(g){return g&&typeof g.url==='string'&&g.url.trim();}):[];
      launch(live.length?live:games);
    })
    .catch(function(){launch(games);});
})();
</script>
</body>
</html>
